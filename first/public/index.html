<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Operation Debug — MONEOO.</title>
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
<link rel="manifest" href="../site.webmanifest">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/cookie-guard.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#050308;
    --panel:#0d0a14;
    --panel-edge:rgba(255,255,255,0.08);
    --danger:#ff3b46;
    --danger-glow:#ff3b4680;
    --safe:#31ffb0;
    --amber:#ffb020;
    --violet:#8a5bff;
    --text:#eef0f6;
    --text-dim:#9a97ad;
    --font-display:'Orbitron', system-ui, sans-serif;
    --font-mono:'Share Tech Mono', monospace;
    --font-body:'Inter', system-ui, sans-serif;
  }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:var(--bg-void); font-family:var(--font-body); }
  #gameCanvas { position:fixed; inset:0; display:block; }

  .scanlines{
    position:fixed; inset:0; z-index:5; pointer-events:none; mix-blend-mode:overlay; opacity:0.35;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px, transparent 1px, transparent 3px);
  }
  .vignette{
    position:fixed; inset:0; z-index:6; pointer-events:none;
    box-shadow: inset 0 0 220px rgba(0,0,0,0.85);
    transition: box-shadow 0.4s ease;
  }
  .vignette.alert{ box-shadow: inset 0 0 260px rgba(255,20,20,0.55); }

  .hud { position:fixed; inset:0; pointer-events:none; z-index:10; color:var(--text); }
  .hud * { pointer-events:auto; }

  .hud-top {
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:1rem 1.25rem; pointer-events:none; gap:0.8rem;
  }
  .glass{
    background:linear-gradient(180deg, rgba(16,13,26,0.75), rgba(10,8,17,0.75));
    backdrop-filter:blur(8px); border:1px solid var(--panel-edge);
    box-shadow:0 8px 24px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .hud-title {
    font-family:var(--font-display); font-weight:800; letter-spacing:0.06em; font-size:0.95rem;
    padding:0.6rem 1rem; border-radius:12px; text-transform:uppercase;
    border-left:3px solid var(--danger);
  }
  .hud-title small { display:block; font-family:var(--font-body); font-weight:600; opacity:0.55; font-size:0.65rem; margin-top:3px; letter-spacing:0.04em; text-transform:none; }
  .hud-counter {
    padding:0.6rem 1rem; border-radius:12px;
    font-family:var(--font-mono); font-weight:700; font-size:0.85rem; display:flex; align-items:center; gap:0.6rem;
    letter-spacing:0.02em;
  }
  .hud-counter .dot { width:9px; height:9px; border-radius:50%; background:var(--danger); box-shadow:0 0 10px var(--danger); animation:pulseDot 1.6s ease-in-out infinite; }
  @keyframes pulseDot{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.4; transform:scale(0.75);} }

  .minimap-wrap{ position:absolute; top:5.4rem; right:1.25rem; padding:0.5rem; border-radius:14px; }
  .minimap-wrap .cap{ font-family:var(--font-mono); font-size:0.6rem; letter-spacing:0.12em; color:var(--text-dim); text-align:center; margin-bottom:0.3rem; text-transform:uppercase;}
  #minimapCanvas{ display:block; border-radius:50%; }

  .hud-prompt {
    position:absolute; bottom:10%; left:50%; transform:translateX(-50%) translateY(10px);
    padding:0.65rem 1.2rem; border-radius:999px;
    font-size:0.85rem; font-weight:700; opacity:0; transition:opacity 0.25s ease, transform 0.25s ease;
    white-space:nowrap; font-family:var(--font-body);
  }
  .hud-prompt.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .hud-prompt kbd {
    background:linear-gradient(180deg,#fff,#c9c9d4); color:#111; border-radius:6px; padding:2px 8px; font-weight:800; margin-right:0.5rem;
    box-shadow:0 2px 0 rgba(0,0,0,0.3);
  }

  .hud-nearby {
    position:absolute; bottom:2.2%; left:50%; transform:translateX(-50%);
    font-family:var(--font-mono); font-size:0.7rem; opacity:0.6; letter-spacing:0.06em; text-transform:uppercase;
  }

  .hud-controls {
    position:absolute; bottom:1.5rem; right:1.25rem;
    padding:0.75rem 1rem; border-radius:14px;
    font-size:0.7rem; line-height:1.8; opacity:0.85; font-family:var(--font-mono);
  }
  .hud-controls b { display:inline-block; min-width:80px; color:var(--amber); font-weight:700; }

  .overlay {
    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(30,10,20,0.6), rgba(2,1,5,0.95));
    backdrop-filter:blur(5px);
  }
  .overlay.hidden { display:none; }
  .panel {
    width:min(560px, 92vw); max-height:88vh; overflow-y:auto;
    background:linear-gradient(180deg,#131019,#0b0910);
    border:1px solid var(--panel-edge);
    border-radius:22px; padding:2rem 2.1rem; color:var(--text);
    box-shadow:0 40px 100px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .panel .eyebrow {
    font-family:var(--font-mono); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.14em; font-weight:700;
    color:var(--danger); margin:0 0 0.5rem;
  }
  .panel h1, .panel h2 { margin:0 0 0.8rem; line-height:1.25; font-family:var(--font-display); }
  .panel h1 { font-size:1.4rem; letter-spacing:0.01em; }
  .panel h2 { font-size:1.1rem; }
  .panel p { line-height:1.7; color:#c7c7d1; margin:0 0 1rem; }
  .panel .story { font-size:0.92rem; }

  .btn-row { display:flex; gap:0.65rem; flex-wrap:wrap; margin-top:1.4rem; }
  .g-btn {
    flex:1 1 140px; border:none; cursor:pointer; border-radius:12px;
    padding:0.85rem 1rem; font-weight:700; font-size:0.9rem; font-family:var(--font-body);
    transition:transform 0.15s ease, filter 0.15s ease; text-align:left;
  }
  .g-btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
  .g-btn:active { transform:translateY(0px) scale(0.98); }
  .g-btn.primary { background:linear-gradient(180deg,#ff4d4d,#e2242f); color:#fff; text-align:center; box-shadow:0 8px 22px var(--danger-glow); }
  .g-btn.ghost { background:rgba(255,255,255,0.06); color:var(--text); border:1px solid rgba(255,255,255,0.1); text-align:center; }

  .progress-track { height:6px; border-radius:999px; background:rgba(255,255,255,0.08); overflow:hidden; margin-top:0.4rem; }
  .progress-fill { height:100%; background:var(--danger); width:0%; transition:width 0.4s ease; }

  .audio-block { margin-top:1.2rem; background:rgba(255,255,255,0.04); border-radius:16px; padding:1rem; }
  .audio-block p { margin:0 0 0.5rem; font-size:0.8rem; color:#9a9aa5; }
  .audio-block audio { width:100%; }

  .fade-black {
    position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; z-index:60; transition:opacity 0.6s ease;
  }
  .fade-black.show { opacity:1; }

  .bomb-overlay .panel{ width:min(640px, 94vw); padding:0; overflow:visible; background:transparent; box-shadow:none; border:none; }
  .bomb-case{
    background:
      linear-gradient(180deg, rgba(255,255,255,0.03), transparent 40%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 6px),
      linear-gradient(160deg,#1a1620,#0c0a12 60%);
    border:1px solid rgba(255,255,255,0.09);
    border-radius:20px;
    padding:1.4rem 1.5rem 1.7rem;
    box-shadow:0 30px 90px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
    position:relative;
  }
  .bomb-case.shake{ animation:bombShake 0.4s ease; }
  @keyframes bombShake{
    0%,100%{ transform:translate(0,0) rotate(0); }
    20%{ transform:translate(-6px,2px) rotate(-0.6deg); }
    40%{ transform:translate(5px,-2px) rotate(0.5deg); }
    60%{ transform:translate(-4px,1px) rotate(-0.4deg); }
    80%{ transform:translate(3px,-1px) rotate(0.3deg); }
  }
  .bomb-topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:0.9rem; }
  .bomb-topbar .zone-tag{ font-family:var(--font-mono); font-size:0.68rem; letter-spacing:0.14em; color:var(--danger); text-transform:uppercase; }
  .bomb-lights{ display:flex; gap:6px; }
  .bomb-lights i{ width:8px; height:8px; border-radius:50%; background:#331014; display:block; }
  .bomb-lights i.on{ background:var(--danger); box-shadow:0 0 8px var(--danger); }

  .lcd{
    background:#04140e; border:1px solid #0d3a29; border-radius:10px; padding:0.9rem 1.05rem;
    box-shadow: inset 0 0 24px rgba(49,255,176,0.12);
    margin-bottom:1.1rem;
  }
  .lcd .lcd-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:0.5rem; }
  .lcd .lcd-clock{ font-family:var(--font-mono); color:var(--safe); font-size:1.1rem; letter-spacing:0.08em; text-shadow:0 0 8px rgba(49,255,176,0.6); }
  .lcd .lcd-status{ font-family:var(--font-mono); font-size:0.65rem; color:var(--safe); opacity:0.8; letter-spacing:0.12em; }
  .lcd .lcd-question{ font-family:var(--font-mono); color:#c9ffe9; font-size:0.92rem; line-height:1.55; text-shadow:0 0 6px rgba(49,255,176,0.35); }

  .wire-panel{ display:flex; flex-direction:column; gap:0.65rem; }
  .wire-row{
    display:flex; align-items:center; gap:0.8rem; cursor:pointer;
    background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:12px;
    padding:0.5rem 0.7rem 0.5rem 0.4rem; transition:background 0.15s ease, border-color 0.15s ease;
  }
  .wire-row:hover{ background:rgba(255,255,255,0.05); border-color:rgba(255,255,255,0.14); }
  .wire-row.disabled{ pointer-events:none; opacity:0.55; }
  .wire-plug{ width:12px; height:12px; border-radius:50%; flex:0 0 auto; background:#222; border:2px solid #444; }
  .wire-cable-wrap{ position:relative; flex:1 1 auto; height:16px; display:flex; align-items:center; }
  .wire-cable{
    position:relative; height:9px; width:100%; border-radius:999px;
    background: linear-gradient(90deg, var(--wc,#ff3b46), var(--wc,#ff3b46));
    box-shadow:0 0 10px var(--wc,#ff3b46), inset 0 2px 2px rgba(255,255,255,0.25), inset 0 -2px 3px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  .wire-cable::after{
    content:''; position:absolute; inset:0;
    background:repeating-linear-gradient(100deg, rgba(255,255,255,0.22) 0 3px, transparent 3px 10px);
    animation:wireGlint 3.4s linear infinite;
  }
  @keyframes wireGlint{ from{ background-position-x:0; } to{ background-position-x:120px; } }
  .wire-cable.cut{
    background: linear-gradient(90deg, var(--wc,#ff3b46) 44%, transparent 44%, transparent 56%, var(--wc,#ff3b46) 56%);
    box-shadow:none; filter:grayscale(0.5) brightness(0.7);
  }
  .wire-cable.cut::after{ display:none; }
  .spark{
    position:absolute; left:50%; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px;
    border-radius:50%; pointer-events:none; opacity:0;
  }
  .spark.go{ animation:sparkPop 0.5s ease-out forwards; }
  @keyframes sparkPop{
    0%{ opacity:1; box-shadow:0 0 0 0 var(--sc,#fff); transform:scale(0.3); }
    100%{ opacity:0; box-shadow:0 0 24px 10px var(--sc,#fff); transform:scale(1.6); }
  }
  .wire-label{ font-size:0.86rem; font-weight:600; color:var(--text); }
  .wire-scissor{ margin-left:auto; font-size:0.85rem; opacity:0.35; flex:0 0 auto; }
  .wire-row:hover .wire-scissor{ opacity:0.9; }
  .wire-row.correct-cut .wire-plug{ background:var(--safe); border-color:var(--safe); box-shadow:0 0 8px var(--safe); }
  .wire-row.correct-cut .wire-label{ color:var(--safe); }

  .bomb-feedback{ margin-top:0.9rem; font-size:0.85rem; font-weight:700; min-height:1.4em; font-family:var(--font-mono); text-align:center; letter-spacing:0.02em; }
  .bomb-feedback.ok { color:var(--safe); text-shadow:0 0 8px rgba(49,255,176,0.5); }
  .bomb-feedback.bad { color:var(--danger); text-shadow:0 0 8px rgba(255,59,70,0.5); }

  @media (max-width: 640px) {
    .hud-controls, .minimap-wrap { display:none; }
    .panel { padding:1.5rem 1.4rem; }
    .bomb-case{ padding:1.1rem 1rem 1.4rem; }
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div class="scanlines"></div>
<div class="vignette" id="vignette"></div>

<div class="hud">
  <div class="hud-top">
    <div class="hud-title glass" id="hudTitle"></div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:0.6rem;">
      <div class="hud-counter glass"><span class="dot"></span><span id="hudCounter"></span></div>
    </div>
  </div>
  <div class="minimap-wrap glass">
    <div class="cap">Radar</div>
    <canvas id="minimapCanvas" width="120" height="120"></canvas>
  </div>
  <div class="hud-nearby" id="hudNearby"></div>
  <div class="hud-prompt glass" id="hudPrompt"><kbd>E</kbd><span id="hudPromptText"></span></div>
  <div class="hud-controls glass" id="hudControls"></div>
</div>

<div class="overlay" id="introOverlay">
  <div class="panel">
    <p class="eyebrow" id="introEyebrow"></p>
    <h1 id="introTitle"></h1>
    <p class="story" id="introStory1"></p>
    <p class="story" id="introStory2"></p>
    <div class="btn-row">
      <button class="g-btn primary" id="introStartBtn"></button>
    </div>
  </div>
</div>

<div class="overlay hidden bomb-overlay" id="puzzleOverlay">
  <div class="panel">
    <div class="bomb-case" id="bombCase">
      <div class="bomb-topbar">
        <span class="zone-tag" id="puzzleZoneName"></span>
        <div class="bomb-lights" id="bombLights"></div>
      </div>
      <div class="lcd">
        <div class="lcd-row">
          <span class="lcd-clock" id="lcdClock">00:00</span>
          <span class="lcd-status" id="lcdStatus">ARMED</span>
        </div>
        <div class="lcd-question" id="puzzleQuestion"></div>
      </div>
      <div class="wire-panel" id="puzzleOptions"></div>
      <p class="bomb-feedback" id="puzzleFeedback"></p>
    </div>
  </div>
</div>

<div class="overlay hidden" id="victoryOverlay">
  <div class="panel">
    <p class="eyebrow" id="victoryEyebrow"></p>
    <h1 id="victoryTitle"></h1>
    <p id="victoryText"></p>

    <div class="audio-block">
      <p id="audioLabel1"></p>
      <audio controls preload="none">
        <source src="audio/antonello-anthem.mp3" type="audio/mpeg">
      </audio>
    </div>
    <div class="audio-block">
      <p id="audioLabel2"></p>
      <audio controls preload="none">
        <source src="audio/bug-victory.mp3" type="audio/mpeg">
      </audio>
    </div>

    <div class="btn-row">
      <a class="g-btn primary" id="victoryBackBtn" href="../index.html" style="text-decoration:none; display:flex; align-items:center; justify-content:center;"></a>
      <button class="g-btn ghost" id="victoryReplayBtn"></button>
    </div>
  </div>
</div>

<div class="fade-black" id="fadeBlack"></div>

<script>
const TEXT = {
  hud: {
    title: "OPERATION DEBUG",
    subtitle: "a MONEOO. side story",
    counter: (n, total) => `Bombs defused: ${n} / ${total}`,
    interact: "Inspect device",
    nearby: (name) => `📍 Approaching: ${name}`,
    controls: "<b>Move</b> W / S<br><b>Turn</b> A / D<br><b>Jump</b> Space<br><b>Interact</b> E"
  },
  intro: {
    eyebrow: "MONEOO. presents",
    title: "Operation Debug",
    p1: "The city of Latticetown used to hum with quiet, well-ordered noise — every wall a grid, every street a clean modular line. Then <b>Antonello Vendetta</b>, a disgraced exterminator with a grudge against every insect alive, hid six DDT devices across the city, each rigged with live wires that only the right answer can safely cut.",
    p2: "You are a small ladybug with an unusually good grasp of post-quantum cryptography. To defuse each device you'll have to prove you understood how ML-KEM actually works — cut the right wire, and the bomb powers down. Cut the wrong one, and it just sparks angrily at you (no real harm, try again). Clear all six, and the way to Antonello's lair will open.",
    start: "Start exploring →"
  },
  zones: [
    {
      name: "The Modular Vault",
      question: "ML-KEM works modulo q = 3329. What is 3330 mod 3329?",
      options: ["0", "1", "3329", "-1"],
      correct: 0,
      ok: "WIRE CUT — 3330 wraps straight back to 0. Timer zeroes out and dies.",
      bad: "WRONG WIRE — sparks fly, nothing detonates. Mod wraps the number back inside [0, q-1]. Try another wire."
    },
    {
      name: "The Lattice Garden",
      question: "Three vectors sit in this reduced lattice basis: A = (2, 1), B = (15, 22), C = (-1, 3). Finding the SHORTEST vector is the hard lattice problem attackers can't solve efficiently. Which one is shortest?",
      options: ["Vector A (2, 1)", "Vector B (15, 22)", "Vector C (-1, 3)", "They're all equal"],
      correct: 0,
      ok: "WIRE CUT — A has length √5 ≈ 2.24, by far the shortest. The device goes limp.",
      bad: "WRONG WIRE — compare the lengths (√(x²+y²)) again, one is clearly the smallest."
    },
    {
      name: "The NTT Forge",
      question: "The Number Theoretic Transform (NTT) is used in ML-KEM to speed up which operation?",
      options: ["Polynomial multiplication", "Password hashing", "Random number generation", "Digital signatures"],
      correct: 0,
      ok: "WIRE CUT — NTT turns slow polynomial multiplication into fast pointwise multiplication. Circuit dead.",
      bad: "WRONG WIRE — think about what NTT is the crypto equivalent of, a much faster transform for multiplying big polynomials."
    },
    {
      name: "The KEM Sequencer",
      question: "In a Key Encapsulation Mechanism, which of these three steps happens FIRST?",
      options: ["KeyGen (create the keypair)", "Encaps (create the ciphertext)", "Decaps (recover the secret)", "They all happen at the same time"],
      correct: 0,
      ok: "WIRE CUT — no keypair, no party. KeyGen always comes first. Wires go dark.",
      bad: "WRONG WIRE — think about the order: you need something before you can lock or unlock anything with it."
    },
    {
      name: "The Security Wing",
      question: "ML-KEM-768 is designed to match the classical security level of which symmetric cipher?",
      options: ["AES-192", "AES-64", "DES", "AES-1024"],
      correct: 0,
      ok: "WIRE CUT — ML-KEM-768 ≈ AES-192-level security (NIST Category 3). Sealed for good.",
      bad: "WRONG WIRE — NIST maps ML-KEM-512 / 768 / 1024 to three AES security categories, one of these doesn't even exist."
    },
    {
      name: "The Fujisaki-Okamoto Chamber",
      question: "The Fujisaki-Okamoto (FO) transform upgrades a weaker encryption scheme into an ML-KEM-grade KEM. Which security notion does it add?",
      options: ["IND-CCA2 (chosen-ciphertext security)", "One-time-pad secrecy", "Perfect forward secrecy only", "Nothing measurable"],
      correct: 0,
      ok: "WIRE CUT — FO hardens the scheme against chosen-ciphertext attacks. Nozzle rusts shut.",
      bad: "WRONG WIRE — FO is famous for turning a merely CPA-secure scheme into something resistant to a much nastier class of attacks."
    }
  ],
  boss: {
    name: "Antonello's Lair",
    lineIntro: "So it's YOU. The bug who keeps reading standards documents. Fine — answer this, if you're so clever:",
    question: "If Bob's decapsulated shared secret does NOT match what Alice originally encapsulated, what does a correctly implemented ML-KEM do?",
    options: [
      "It still outputs a pseudorandom value — implicit rejection, no error is ever revealed",
      "It throws a visible 'decryption failed' error",
      "It leaks the private key so you can debug it",
      "It crashes the whole connection immediately"
    ],
    correct: 0,
    ok: "FINAL WIRE CUT — implicit rejection means nothing observable ever betrays a mismatch. Antonello's last device sputters, hisses, and dies.",
    bad: "WRONG WIRE — a visible error here would be a side-channel goldmine for an attacker. That's exactly what ML-KEM avoids."
  },
  gateOpenTitle: "The path to Antonello's lair has opened.",
  victory: {
    eyebrow: "Mission complete",
    title: "Latticetown is safe again",
    text: "All six devices are down and Antonello Vendetta has been talked into a permanent early retirement. Not bad for a bug who just wanted to understand a NIST standard.",
    audio1: "🎵 Antonello's Anthem (villain theme) — add your generated track to game/audio/antonello-anthem.mp3",
    audio2: "🎵 Bug's Victory Song — add your generated track to game/audio/bug-victory.mp3",
    back: "← Back to the guide",
    replay: "Play again"
  }
};
</script>
<script>
(function () {
  "use strict";

  const el = (id) => document.getElementById(id);
  el("hudTitle").innerHTML = `${TEXT.hud.title}<small>${TEXT.hud.subtitle}</small>`;
  el("hudControls").innerHTML = TEXT.hud.controls;
  el("introEyebrow").textContent = TEXT.intro.eyebrow;
  el("introTitle").textContent = TEXT.intro.title;
  el("introStory1").innerHTML = TEXT.intro.p1;
  el("introStory2").innerHTML = TEXT.intro.p2;
  el("introStartBtn").textContent = TEXT.intro.start;
  el("victoryEyebrow").textContent = TEXT.victory.eyebrow;
  el("victoryTitle").textContent = TEXT.victory.title;

    if (!actx) return;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type || "square";
    osc.frequency.value = freq;
    gain.gain.value = 0;
    osc.connect(gain).connect(actx.destination);
    const t0 = actx.currentTime;
    gain.gain.linearRampToValueAtTime(gainPeak || 0.06, t0 + 0.01);
    gain.gain.linearRampToValueAtTime(0, t0 + duration);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

    grad.addColorStop(1, "#050308");

    function blob(x, y, r, color, alpha) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, color.replace("ALPHA", alpha));
      g.addColorStop(1, color.replace("ALPHA", "0"));
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    blob(260, 160, 260, "rgba(138,91,255,ALPHA)", "0.35");
    blob(760, 220, 300, "rgba(255,59,70,ALPHA)", "0.18");
    blob(520, 90, 220, "rgba(49,255,176,ALPHA)", "0.10");

      const x = Math.random() * c.width;
      const y = Math.random() * c.height * 0.75;
      const r = Math.random() * 1.3 + 0.2;
      ctx.globalAlpha = Math.random() * 0.8 + 0.2;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();

    return new THREE.CanvasTexture(c);

    ctx.fillRect(0, 0, c.width, c.height);

    ctx.lineWidth = 1;
    const step = 32;
    for (let x = 0; x <= c.width; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, c.height); ctx.stroke(); }
    for (let y = 0; y <= c.height; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(c.width, y); ctx.stroke(); }

    const colors = ["rgba(255,59,70,0.65)", "rgba(49,255,176,0.55)", "rgba(122,59,255,0.6)", "rgba(255,176,32,0.5)"];
    for (let i = 0; i < 46; i++) {
      const color = colors[i % colors.length];
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.random() < 0.2 ? 3 : 1.5;
      let x = Math.floor(Math.random() * (c.width / step)) * step;
      let y = Math.floor(Math.random() * (c.height / step)) * step;
      ctx.beginPath(); ctx.moveTo(x, y);
      const segs = 3 + Math.floor(Math.random() * 5);
      for (let s = 0; s < segs; s++) {
        if (Math.random() < 0.5) x += (Math.random() < 0.5 ? 1 : -1) * step * (1 + Math.floor(Math.random() * 3));
        else y += (Math.random() < 0.5 ? 1 : -1) * step * (1 + Math.floor(Math.random() * 3));
        x = Math.max(0, Math.min(c.width, x));
        y = Math.max(0, Math.min(c.height, y));
        ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
    }
    return c;
  }

  const MOVE_SPEED = 9.5;

  function updatePlayer(dt) {
    if (!state.started || state.puzzleOpen) return;

    let turn = 0;
    if (keys["KeyA"] || keys["ArrowLeft"]) turn += 1;
    if (keys["KeyD"] || keys["ArrowRight"]) turn -= 1;
    player.rotation.y += turn * TURN_SPEED * dt;

    let move = 0;
    if (keys["KeyW"] || keys["ArrowUp"]) move += 1;
    if (keys["KeyS"] || keys["ArrowDown"]) move -= 0.6;

    const forward = new THREE.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y));
    player.position.addScaledVector(forward, move * MOVE_SPEED * dt);

    const dist = Math.sqrt(player.position.x ** 2 + player.position.z ** 2);
    if (dist > 66) {
      player.position.x *= 66 / dist;
      player.position.z *= 66 / dist;
    }

    if ((keys["Space"]) && onGround) {
      velocityY = JUMP_FORCE;
      onGround = false;
    }
    velocityY += GRAVITY * dt;
    player.position.y += velocityY * dt;
    if (player.position.y <= 0) {
      player.position.y = 0;
      velocityY = 0;
      onGround = true;
    }

    if (move !== 0) {
      bobTime += dt * 10;
      shellBody.position.y = 0.42 + Math.sin(bobTime) * 0.04;

  }

  const camOffset = new THREE.Vector3(0, 4.2, -8);

  function updateCamera(dt) {
    const rotatedOffset = camOffset.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
    const desired = player.position.clone().add(rotatedOffset);
    camera.position.lerp(desired, 1 - Math.pow(0.001, dt));

      camera.position.x += (Math.random() - 0.5) * s;
      camera.position.y += (Math.random() - 0.5) * s;
    }
    camTarget.lerp(player.position.clone().add(new THREE.Vector3(0, 1.1, 0)), 1 - Math.pow(0.0005, dt));
    camera.lookAt(camTarget);
  }

  const INTERACT_RANGE = 3.4;

  function updateProximity() {
    if (!state.started) return;

    let closest = null;
    let closestDist = Infinity;
    zoneMeshes.forEach((z) => {
      if (z.solved) return;
      const dx = player.position.x - z.x;
      const dz = player.position.z - z.z;
      const d = Math.sqrt(dx * dx + dz * dz);
      if (d < closestDist) { closestDist = d; closest = z; }
    });

    const bossDist = Math.sqrt(player.position.x ** 2 + (player.position.z + 3.2) ** 2);
    nearBoss = state.bossUnlocked && !state.bossSolved && bossDist < INTERACT_RANGE + 1;

    if (nearBoss) {
      activeZoneIndex = -2;
      el("hudPromptText").textContent = TEXT.hud.interact;
      el("hudPrompt").classList.add("show");
      el("hudNearby").textContent = TEXT.boss.name;
    } else if (closest && closestDist < INTERACT_RANGE) {
      activeZoneIndex = closest.index;
      el("hudPromptText").textContent = TEXT.hud.interact;
      el("hudPrompt").classList.add("show");
      el("hudNearby").textContent = TEXT.hud.nearby(closest.name);
    } else {
      activeZoneIndex = -1;
      el("hudPrompt").classList.remove("show");
      el("hudNearby").textContent = closest && closestDist < NEARBY_RANGE ? TEXT.hud.nearby(closest.name) : "";
    }
  }

  const minimapCanvas = el("minimapCanvas");
  const mctx = minimapCanvas.getContext("2d");
  const MM_SIZE = 120, MM_R = MM_SIZE / 2, MM_SCALE = 0.62;
  function drawMinimap() {
    mctx.clearRect(0, 0, MM_SIZE, MM_SIZE);
    mctx.save();
    mctx.beginPath(); mctx.arc(MM_R, MM_R, MM_R - 2, 0, Math.PI * 2); mctx.clip();
    mctx.fillStyle = "rgba(10,8,17,0.85)";
    mctx.fillRect(0, 0, MM_SIZE, MM_SIZE);
    mctx.strokeStyle = "rgba(122,59,255,0.25)";
    for (let r = 1; r <= 3; r++) { mctx.beginPath(); mctx.arc(MM_R, MM_R, (MM_R - 4) * (r / 3), 0, Math.PI * 2); mctx.stroke(); }
    const sweepAngle = (performance.now() * 0.0012) % (Math.PI * 2);
    const grad = mctx.createConicGradient ? mctx.createConicGradient(sweepAngle, MM_R, MM_R) : null;
    if (grad) {
      grad.addColorStop(0, "rgba(49,255,176,0.35)");
      grad.addColorStop(0.06, "rgba(49,255,176,0)");
      grad.addColorStop(1, "rgba(49,255,176,0)");
      mctx.fillStyle = grad;
      mctx.beginPath(); mctx.arc(MM_R, MM_R, MM_R - 2, 0, Math.PI * 2); mctx.fill();
    }

    function toMap(x, z) {
      return [MM_R + (x - player.position.x) * MM_SCALE, MM_R + (z - player.position.z) * MM_SCALE];
    }
    const bp = toMap(0, -3.2);
    mctx.fillStyle = state.bossUnlocked ? "#ff3b46" : "#5a4a66";
    mctx.beginPath(); mctx.arc(bp[0], bp[1], 4, 0, Math.PI * 2); mctx.fill();

    zoneMeshes.forEach((z) => {
      const p = toMap(z.x, z.z);
      if (p[0] < -4 || p[0] > MM_SIZE + 4 || p[1] < -4 || p[1] > MM_SIZE + 4) return;
      mctx.fillStyle = z.solved ? "#31ffb0" : "#ff3b46";
      mctx.beginPath(); mctx.arc(p[0], p[1], 3.4, 0, Math.PI * 2); mctx.fill();
    });

    mctx.save();
    mctx.translate(MM_R, MM_R);
    mctx.rotate(player.rotation.y);
    mctx.fillStyle = "#eef0f6";
    mctx.beginPath();
    mctx.moveTo(0, -6); mctx.lineTo(4, 5); mctx.lineTo(-4, 5); mctx.closePath();
    mctx.fill();
    mctx.restore();

    mctx.restore();
    mctx.strokeStyle = "rgba(255,255,255,0.15)";
    mctx.beginPath(); mctx.arc(MM_R, MM_R, MM_R - 2, 0, Math.PI * 2); mctx.stroke();
  }

  const WIRE_COLORS = ["#ff3b46", "#3ba0ff", "#ffd23b", "#31ffb0", "#c93bff"];
  let tickInterval = null;
  let lcdSeconds = 0;

  function shuffleColors(n) {
    const pool = WIRE_COLORS.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    return pool.slice(0, n);
  }

  function startLcdClock() {
    lcdSeconds = 0;
    el("lcdClock").textContent = "00:00";
    el("lcdStatus").textContent = "ARMED";
    el("lcdStatus").style.color = "var(--safe)";
    clearInterval(tickInterval);
    tickInterval = setInterval(() => {
      lcdSeconds++;
      const m = String(Math.floor(lcdSeconds / 60)).padStart(2, "0");
      const s = String(lcdSeconds % 60).padStart(2, "0");
      el("lcdClock").textContent = `${m}:${s}`;
      sfx.tick();
    }, 1000);
  }
  function stopLcdClock(success) {
    clearInterval(tickInterval);
    el("lcdStatus").textContent = success ? "DISARMED" : "STOPPED";
    el("lcdStatus").style.color = success ? "var(--safe)" : "var(--danger)";
  }

  function renderBombLights(n) {
    const wrap = el("bombLights");
    wrap.innerHTML = "";
    for (let i = 0; i < n; i++) {
      const lamp = document.createElement("i");
      wrap.appendChild(lamp);
    }
    let li = 0;
    clearInterval(renderBombLights._t);
    renderBombLights._t = setInterval(() => {
      Array.from(wrap.children).forEach((c, i) => c.classList.toggle("on", i === li));
      li = (li + 1) % n;
    }, 260);
  }

  function renderPuzzle(zoneName, questionText, options, correctIndex, okMsg, badMsg, onSolved) {
    state.puzzleOpen = true;
    el("hudPrompt").classList.remove("show");
    const overlay = el("puzzleOverlay");
    overlay.classList.remove("hidden");
    el("puzzleZoneName").textContent = zoneName;
    el("puzzleQuestion").textContent = questionText;
    renderBombLights(Math.min(6, options.length + 2));
    startLcdClock();

    const optWrap = el("puzzleOptions");
    optWrap.innerHTML = "";
    const feedback = el("puzzleFeedback");
    feedback.textContent = "";
    feedback.className = "bomb-feedback";
    const bombCase = el("bombCase");
    const colors = shuffleColors(options.length);

    let solvedAlready = false;

    options.forEach((opt, i) => {
      const row = document.createElement("div");
      row.className = "wire-row";
      row.style.setProperty("--wc", colors[i]);

      const plug = document.createElement("div");
      plug.className = "wire-plug";

      const cableWrap = document.createElement("div");
      cableWrap.className = "wire-cable-wrap";
      const cable = document.createElement("div");
      cable.className = "wire-cable";
      const spark = document.createElement("div");
      spark.className = "spark";
      spark.style.setProperty("--sc", colors[i]);
      cableWrap.appendChild(cable);
      cableWrap.appendChild(spark);

      const label = document.createElement("span");
      label.className = "wire-label";
      label.textContent = opt;

      const scissor = document.createElement("span");
      scissor.className = "wire-scissor";
      scissor.textContent = "✂ cut";

      row.appendChild(plug);
      row.appendChild(cableWrap);
      row.appendChild(label);
      row.appendChild(scissor);

      row.addEventListener("click", () => {
        if (solvedAlready) return;
        if (i === correctIndex) {
          solvedAlready = true;
          cable.classList.add("cut");
          spark.classList.add("go");
          row.classList.add("correct-cut");
          Array.from(optWrap.children).forEach((r) => r.classList.add("disabled"));
          feedback.textContent = okMsg;
          feedback.className = "bomb-feedback ok";
          stopLcdClock(true);
          sfx.correct();
          setTimeout(() => {
            overlay.classList.add("hidden");
            state.puzzleOpen = false;
            clearInterval(renderBombLights._t);
            onSolved();
          }, 1300);
        } else {
          spark.classList.remove("go"); void spark.offsetWidth; spark.classList.add("go");
          bombCase.classList.remove("shake"); void bombCase.offsetWidth; bombCase.classList.add("shake");
          feedback.textContent = badMsg;
          feedback.className = "bomb-feedback bad";
          sfx.wrong();
          el("vignette").classList.add("alert");
          setTimeout(() => el("vignette").classList.remove("alert"), 350);
          triggerShake(0.06, 0.35);
        }
      });

      optWrap.appendChild(row);
    });
  }

  function openZonePuzzle(index) {
    const z = TEXT.zones[index];
    renderPuzzle(z.name, z.question, z.options, z.correct, z.ok, z.bad, () => solveZone(index));
  }

  function solveZone(index) {
    state.solved[index] = true;
    const mesh = zoneMeshes[index];
    mesh.solved = true;
    updateCounter();

    mesh.ringMat.color.set(0x31ffb0);
    mesh.ring2Mat.color.set(0x31ffb0);
    mesh.stationLight.color.set(0x31ffb0);
    mesh.stationLight.intensity = 0.4;
    const startScale = mesh.canister.scale.clone();
    const duration = 700;
    const t0 = performance.now();
    function animateDefuse(now) {
      const t = Math.min(1, (now - t0) / duration);
      mesh.canister.scale.set(startScale.x * (1 - t), startScale.y * (1 - t), startScale.z * (1 - t));
      if (t < 1) requestAnimationFrame(animateDefuse);
      else mesh.canister.visible = false;
    }
    requestAnimationFrame(animateDefuse);

    if (state.solved.every(Boolean) && !state.bossUnlocked) {
      unlockBoss();
    }
  }

  function unlockBoss() {
    state.bossUnlocked = true;
    const t0 = performance.now();
    const duration = 900;
    function animateBarrier(now) {
      const t = Math.min(1, (now - t0) / duration);
      barrierMat.opacity = 0.35 * (1 - t);
      barrierMat2.opacity = 0.18 * (1 - t);
      if (t < 1) requestAnimationFrame(animateBarrier);
      else { barrier.visible = false; barrier2.visible = false; }
    }
    requestAnimationFrame(animateBarrier);

    flashPrompt(TEXT.gateOpenTitle);
  }

  function flashPrompt(msg) {
    const p = el("hudPrompt");
    const original = p.innerHTML;
    el("hudPromptText").textContent = "";
    p.innerHTML = `<span>${msg}</span>`;
    p.classList.add("show");
    setTimeout(() => {
      p.classList.remove("show");
      setTimeout(() => (p.innerHTML = original), 300);
    }, 2600);
  }

  function openBossPuzzle() {
    renderPuzzle(
      TEXT.boss.name,
      `${TEXT.boss.lineIntro} ${TEXT.boss.question}`,
      TEXT.boss.options,
      TEXT.boss.correct,
      TEXT.boss.ok,
      TEXT.boss.bad,
      () => {
        state.bossSolved = true;
        defeatAntonello();
      }
    );
  }

  function defeatAntonello() {
    triggerShake(0.12, 0.8);
    const t0 = performance.now();
    const duration = 1000;
    const startRotZ = antonello.rotation.z;
    function animateFall(now) {
      const t = Math.min(1, (now - t0) / duration);
      antonello.rotation.z = startRotZ + t * (Math.PI / 2.1);
      antonello.position.y = -t * 0.3;
      if (t < 1) requestAnimationFrame(animateFall);
      else showVictory();
    }
    requestAnimationFrame(animateFall);
  }

  function showVictory() {
    el("fadeBlack").classList.add("show");
    setTimeout(() => {
      el("victoryOverlay").classList.remove("hidden");
      el("fadeBlack").classList.remove("show");
    }, 650);
  }

  window.addEventListener("keydown", (e) => {
    if (e.code === "Escape" && state.puzzleOpen && !nearBoss) {
      el("puzzleOverlay").classList.add("hidden");
      state.puzzleOpen = false;
      clearInterval(tickInterval);
      clearInterval(renderBombLights._t);
    }
  });

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    updatePlayer(dt);
    updateCamera(dt);
    updateProximity();
    drawMinimap();

    const t = performance.now();
    zoneMeshes.forEach((z) => {
      if (!z.solved) {
        z.canister.rotation.y += dt * 0.6;
        if (z.canister.userData.led) {
          z.canister.userData.led.visible = Math.sin(t * 0.006 + z.index) > -0.3;
        }
        z.ring.rotation.z += dt * 0.15;
        z.ring2.rotation.z -= dt * 0.1;
      }
    });
    barrierMat.opacity = state.bossUnlocked ? barrierMat.opacity : 0.3 + Math.sin(t * 0.002) * 0.08;
    barrierMat2.opacity = state.bossUnlocked ? barrierMat2.opacity : 0.14 + Math.sin(t * 0.0024 + 1) * 0.06;
    if (!state.bossSolved) {
      antonello.position.y = Math.sin(t * 0.0018) * 0.05;
    }

    const posAttr = particleGeo.attributes.position;
    for (let i = 0; i < particleCount; i++) {
      posAttr.array[i * 3 + 1] -= dt * 0.6;
      if (posAttr.array[i * 3 + 1] < 0) posAttr.array[i * 3 + 1] = 30;
    }
    posAttr.needsUpdate = true;

    renderer.render(scene, camera);
  }
  animate();
})();
</script>
