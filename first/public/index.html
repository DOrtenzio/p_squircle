<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MONEOO.</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Fallback tokens in case css/style.css fails to load */
    :root{
      --bg-color:#f5f5f5; --text-main:#111111; --text-muted:#666666;
      --accent:#111111; --radius:32px; --shadow:0 34px 80px rgba(0,0,0,0.08);
    }
    html,body{height:100%;}
    body{
      margin:0; display:grid; place-items:center;
      background:var(--bg-color); color:var(--text-main);
      font-family:'Inter', system-ui, sans-serif;
    }
    .redirect-note{
      position:fixed; bottom:1.5rem; left:0; right:0;
      text-align:center; color:var(--text-muted); font-size:0.85rem;
    }
    .consent-card{
      max-width:520px; width:100%; text-align:left;
    }
    .consent-card h1{ text-align:center; }
    .consent-card > p#consentDesc{ text-align:center; }
    .consent-actions{
      display:flex; flex-wrap:wrap; gap:0.75rem; margin-top:1.75rem; justify-content:center;
    }
    .consent-actions .btn{ flex:1 1 140px; cursor:pointer; border:none; font-weight:600; font-size:0.92rem; padding:14px 16px; }
    .consent-actions .btn-text{ flex:1 1 140px; text-decoration:none; border-radius:999px; border:1px solid rgba(0,0,0,0.12); }
    .consent-note{ margin-top:1.25rem; font-size:0.8rem; color:var(--text-muted); line-height:1.6; text-align:center; }
    .squircle-icon{ width:60px; height:60px; background:#111; border-radius:20px; margin:0 auto 1.5rem; }

    /* Customize panel */
    .consent-categories{
      margin-top:1.5rem; padding-top:1.25rem; border-top:1px solid rgba(0,0,0,0.08);
    }
    .consent-category{
      display:flex; align-items:flex-start; justify-content:space-between; gap:1rem;
      padding:0.85rem 0;
    }
    .consent-category + .consent-category{ border-top:1px solid rgba(0,0,0,0.06); }
    .consent-category-copy strong{ display:block; font-size:0.95rem; margin-bottom:0.2rem; }
    .consent-category-copy span{ display:block; font-size:0.82rem; color:var(--text-muted); line-height:1.5; }

    .toggle-switch{
      position:relative; flex-shrink:0; width:44px; height:26px; margin-top:0.15rem;
    }
    .toggle-switch input{ opacity:0; width:0; height:0; }
    .toggle-slider{
      position:absolute; inset:0; background:rgba(0,0,0,0.15); border-radius:999px;
      transition:background 0.2s ease; cursor:pointer;
    }
    .toggle-slider::before{
      content:""; position:absolute; height:20px; width:20px; left:3px; top:3px;
      background:#fff; border-radius:50%; transition:transform 0.2s ease;
      box-shadow:0 2px 6px rgba(0,0,0,0.2);
    }
    .toggle-switch input:checked + .toggle-slider{ background:var(--accent); }
    .toggle-switch input:checked + .toggle-slider::before{ transform:translateX(18px); }
    .toggle-switch input:disabled + .toggle-slider{ opacity:0.5; cursor:not-allowed; }

    #saveCustomBtn{ width:100%; margin-top:1.25rem; border:none; cursor:pointer; font-weight:600; }
  </style>
</head>
<body>

  <div class="gatekeeper-overlay" id="consentOverlay">
    <div class="gatekeeper-card consent-card" role="dialog" aria-modal="true" aria-labelledby="consentTitle">
      <div class="squircle-icon"></div>
      <h1 id="consentTitle" style="margin:0 0 0.75rem; font-size:1.6rem;"></h1>
      <p id="consentDesc" style="color:var(--text-muted); line-height:1.8; margin:0;"></p>

      <div class="consent-actions" id="mainActions">
        <button id="acceptAllBtn" class="btn btn-primary"></button>
        <button id="rejectBtn" class="btn btn-outline"></button>
        <button id="customizeBtn" class="btn btn-text"></button>
      </div>

      <div class="consent-categories hidden" id="categoriesPanel">
        <div class="consent-category">
          <div class="consent-category-copy">
            <strong id="catNecessaryTitle"></strong>
            <span id="catNecessaryDesc"></span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" checked disabled>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="consent-category">
          <div class="consent-category-copy">
            <strong id="catPreferencesTitle"></strong>
            <span id="catPreferencesDesc"></span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="prefToggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="consent-category">
          <div class="consent-category-copy">
            <strong id="catAnalyticsTitle"></strong>
            <span id="catAnalyticsDesc"></span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="analyticsToggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="consent-category">
          <div class="consent-category-copy">
            <strong id="catMarketingTitle"></strong>
            <span id="catMarketingDesc"></span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="marketingToggle">
            <span class="toggle-slider"></span>
          </label>
        </div>

        <button id="saveCustomBtn" class="btn btn-primary"></button>
      </div>

      <p id="consentNote" class="consent-note"></p>
    </div>
  </div>

  <p class="redirect-note" id="redirectNote"></p>

    var STORAGE_KEY = "moneoo_cookie_consent";
    var LANG_KEY = "moneoo_lang";

    function safeLocalStorageGet(key) {
      try { return window.localStorage.getItem(key); } catch (e) { return null; }
    }
    function safeLocalStorageSet(key, value) {
      try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; }
    }

    function setCookie(name, value, days) {
      try {
        var expires = "";
        if (days) {
          var d = new Date();
          d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
          expires = "; expires=" + d.toUTCString();
        }
        document.cookie = name + "=" + encodeURIComponent(value) + expires + "; path=/; SameSite=Lax";
      } catch (e) { /* cookies disabled — localStorage already covers this */ }
    }
    function getCookie(name) {
      try {
        var match = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
        return match ? decodeURIComponent(match[1]) : null;
      } catch (e) { return null; }
    }

    function getStoredConsent() {
      var raw = safeLocalStorageGet(STORAGE_KEY) || getCookie(STORAGE_KEY);
      if (!raw) return null;
      try { return JSON.parse(raw); } catch (e) { return null; }
    }
    function storeConsent(level, categories) {
      var flags = categories || {
        preferences: level === "all",
        analytics: level === "all",
        marketing: level === "all"
      };
      var payload = JSON.stringify({
        level: level, // "all" | "necessary" | "custom"
        necessary: true,
        preferences: !!flags.preferences,
        analytics: !!flags.analytics,
        marketing: !!flags.marketing,
        timestamp: new Date().toISOString()
      });
      safeLocalStorageSet(STORAGE_KEY, payload);
      setCookie(STORAGE_KEY, payload, 180);
    }
    function storeLang(lang) {
      safeLocalStorageSet(LANG_KEY, lang);
      setCookie(LANG_KEY, lang, 365);
    }
    function getStoredLang() {
      return safeLocalStorageGet(LANG_KEY) || getCookie(LANG_KEY);
    }

    // ---------------------------------------------------------------
    // 4) Language detection
    // ---------------------------------------------------------------
    function detectLang() {
      var stored = getStoredLang();
      if (stored && SUPPORTED_LANGS.indexOf(stored) !== -1) return stored;

      var candidates = [];
      if (Array.isArray(navigator.languages)) candidates = candidates.concat(navigator.languages);
      if (navigator.language) candidates.push(navigator.language);
      if (navigator.userLanguage) candidates.push(navigator.userLanguage); // old IE, just in case

      for (var i = 0; i < candidates.length; i++) {
        var code = String(candidates[i] || "").toLowerCase().split("-")[0];
        if (SUPPORTED_LANGS.indexOf(code) !== -1) return code;
      }
      return DEFAULT_LANG;
    }

    // ---------------------------------------------------------------
    // 5) Redirect target
    //    If we were sent here by cookie-guard.js from another page
    //    (?returnTo=...), go back there instead of the language home.
    //    Only same-origin, non protocol-relative targets are honored.
    // ---------------------------------------------------------------
    function targetUrl(lang) {
      return "docs/" + lang + "/index.html";
    }
    function getReturnTarget() {
      try {
        var params = new URLSearchParams(window.location.search);
        var rt = params.get("returnTo");
        if (!rt) return null;
        if (/^https?:\/\//i.test(rt)) {
          return rt.indexOf(window.location.origin) === 0 ? rt : null;
        }
        if (rt.indexOf("//") === 0) return null; // protocol-relative, unsafe
        return rt;
      } catch (e) { return null; }
    }
    function goToGuide(lang) {
      var note = document.getElementById("redirectNote");
      var t = STRINGS[lang] || STRINGS[DEFAULT_LANG];
      if (note) note.textContent = t.redirecting;
      window.location.replace(getReturnTarget() || targetUrl(lang));
    }

    // ---------------------------------------------------------------
    // 6) Main flow
    // ---------------------------------------------------------------
    var lang = detectLang();
    document.getElementById("htmlRoot").setAttribute("lang", lang);
    if (RTL_LANGS.indexOf(lang) !== -1) {
      document.getElementById("htmlRoot").setAttribute("dir", "rtl");
    }

    var existingConsent = getStoredConsent();
    if (existingConsent && existingConsent.necessary) {
      // Consent already given previously: skip the banner entirely.
      storeLang(lang);
      goToGuide(lang);
      return;
    }

    // No consent on record yet — show the banner in the detected language.
    var t = STRINGS[lang] || STRINGS[DEFAULT_LANG];
    document.getElementById("consentTitle").textContent = t.title;
    document.getElementById("consentDesc").textContent = t.desc;
    document.getElementById("acceptAllBtn").textContent = t.acceptAll;
    document.getElementById("rejectBtn").textContent = t.reject;
    document.getElementById("customizeBtn").textContent = t.customize;
    document.getElementById("saveCustomBtn").textContent = t.save;
    document.getElementById("consentNote").textContent = t.note;

    document.getElementById("catNecessaryTitle").textContent = t.catNecessary;
    document.getElementById("catNecessaryDesc").textContent = t.catNecessaryDesc;
    document.getElementById("catPreferencesTitle").textContent = t.catPreferences;
    document.getElementById("catPreferencesDesc").textContent = t.catPreferencesDesc;
    document.getElementById("catAnalyticsTitle").textContent = t.catAnalytics;
    document.getElementById("catAnalyticsDesc").textContent = t.catAnalyticsDesc;
    document.getElementById("catMarketingTitle").textContent = t.catMarketing;
    document.getElementById("catMarketingDesc").textContent = t.catMarketingDesc;

    document.getElementById("acceptAllBtn").addEventListener("click", function () {
      storeConsent("all");
      storeLang(lang);
      goToGuide(lang);
    });
    document.getElementById("rejectBtn").addEventListener("click", function () {
      storeConsent("necessary");
      storeLang(lang);
      goToGuide(lang);
    });
    document.getElementById("customizeBtn").addEventListener("click", function () {
      document.getElementById("categoriesPanel").classList.toggle("hidden");
    });
    document.getElementById("saveCustomBtn").addEventListener("click", function () {
      storeConsent("custom", {
        preferences: document.getElementById("prefToggle").checked,
        analytics: document.getElementById("analyticsToggle").checked,
        marketing: document.getElementById("marketingToggle").checked
      });
      storeLang(lang);
      goToGuide(lang);
    });
  })();
  </script>
</body>
</html>
